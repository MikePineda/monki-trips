<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384" role="img" aria-labelledby="t d">
  <title id="t">Kiko sprite sheet</title>
  <desc id="d">Original artwork for monki-trips, AGPL-3.0-only. 64 by 64 frames, one row per state: happy, worried, excited, asleep, celebrating, thinking.</desc>
  <style>
    .fur { fill: #8B5A2B; } .skin { fill: #E8C39E; } .ink { fill: #16161A; }
    .line { stroke: #16161A; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .arm { stroke: #8B5A2B; stroke-width: 7; stroke-linecap: round; fill: none; }
    .thin { stroke: #62626D; stroke-width: 1.5; stroke-linecap: round; fill: none; }
    .hi { fill: #FAFAF7; }
  </style>
  <defs>
    <!-- Backpack and passport, behind the body. Local box 100x120, scaled 0.5 per frame. -->
    <g id="back">
      <rect x="12" y="46" width="52" height="54" rx="13" fill="#4E7A3B"/>
      <rect x="12" y="46" width="52" height="15" rx="7.5" fill="#2F5126"/>
      <rect x="31" y="66" width="12" height="7" rx="1.5" fill="#E0A93A"/>
      <path d="M18 61v30M58 61v30" stroke="#2F5126" stroke-width="3" fill="none"/>
      <g transform="rotate(14 60 40)"><rect x="54" y="30" width="15" height="21" rx="2" fill="#22508F"/><rect x="57" y="35" width="9" height="2" fill="#8FB0E0"/><rect x="57" y="40" width="9" height="2" fill="#8FB0E0"/><circle cx="61.5" cy="46" r="1.5" fill="#8FB0E0"/></g>
    </g>
    <path id="tail-a" d="M34 98c-16 8-26-6-16-18" stroke="#8B5A2B" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path id="tail-b" d="M34 98c-18 4-28-10-14-20" stroke="#8B5A2B" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Torso, feet, ears, head and face, without eyes, mouth or arms. -->
    <g id="front">
      <rect x="30" y="68" width="40" height="38" rx="15" class="fur"/>
      <ellipse cx="50" cy="88" rx="12" ry="13" class="skin"/>
      <ellipse cx="41" cy="106" rx="9" ry="5" fill="#5C3A1A"/>
      <ellipse cx="59" cy="106" rx="9" ry="5" fill="#5C3A1A"/>
      <circle cx="25" cy="42" r="9.5" class="fur"/><circle cx="75" cy="42" r="9.5" class="fur"/>
      <circle cx="25" cy="42" r="4.5" class="skin"/><circle cx="75" cy="42" r="4.5" class="skin"/>
      <circle cx="50" cy="44" r="23" class="fur"/>
      <path d="M34 47a16 13 0 0 0 32 0a16 17 0 0 0-32 0z" class="skin"/>
      <path d="M38 30q12-6 24 0" stroke="#5C3A1A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>
    <g id="hand"><circle r="5" class="skin"/></g>
    <g id="eyes-open"><circle cx="43" cy="46" r="2.8" class="ink"/><circle cx="57" cy="46" r="2.8" class="ink"/><circle cx="44" cy="45" r="0.9" class="hi"/><circle cx="58" cy="45" r="0.9" class="hi"/></g>
    <g id="eyes-blink"><path d="M40 46h6M54 46h6" class="line"/></g>
    <path id="smile" d="M43 54q7 6 14 0" class="line"/>
    <g id="arms-down"><path d="M34 80L20 94" class="arm"/><path d="M66 80L80 94" class="arm"/><use href="#hand" x="19" y="95"/><use href="#hand" x="81" y="95"/></g>
    <g id="arms-up"><path d="M34 78L18 58" class="arm"/><path d="M66 78L82 58" class="arm"/><use href="#hand" x="17" y="57"/><use href="#hand" x="83" y="57"/></g>
    <g id="arms-up-high"><path d="M34 76L16 52" class="arm"/><path d="M66 76L84 52" class="arm"/><use href="#hand" x="15" y="51"/><use href="#hand" x="85" y="51"/></g>
  </defs>
  <!-- happy 0 -->
  <g transform="translate(7 2) scale(0.5)"><use href="#back"/><use href="#tail-a"/><use href="#front"/><use href="#arms-down"/><use href="#eyes-open"/><use href="#smile"/></g>
  <!-- happy 1 -->
  <g transform="translate(71 2) scale(0.5)"><use href="#back"/><use href="#tail-a"/><use href="#front"/><use href="#arms-down"/><use href="#eyes-blink"/><use href="#smile"/></g>
  <!-- happy 2 -->
  <g transform="translate(135 2) scale(0.5)"><use href="#back"/><use href="#tail-b"/><use href="#front"/><use href="#arms-down"/><use href="#eyes-open"/><use href="#smile"/></g>
  <!-- worried 0 -->
  <g transform="translate(7 66) scale(0.5)"><use href="#back"/><use href="#tail-a"/><use href="#front"/><path d="M34 80L20 94" class="arm"/><path d="M66 80C82 70 80 52 72 40" class="arm"/><use href="#hand" x="19" y="95"/><use href="#hand" x="71" y="39"/><path d="M38 38l9 3M62 38l-9 3" class="line"/><circle cx="43" cy="46" r="2.6" class="ink"/><circle cx="57" cy="46" r="2.6" class="ink"/><path d="M43 57q3.5-3 7 0t7 0" class="line"/><path d="M28 26c0-4 3-8 3-8s3 4 3 8a3 3 0 0 1-6 0z" fill="#8FB0E0"/></g>
  <!-- worried 1 -->
  <g transform="translate(71 66) scale(0.5)"><use href="#back"/><use href="#tail-a"/><use href="#front"/><path d="M34 80L20 94" class="arm"/><path d="M66 80C84 72 82 50 76 36" class="arm"/><use href="#hand" x="75" y="35"/><use href="#hand" x="19" y="95"/><path d="M38 38l9 3M62 38l-9 3" class="line"/><circle cx="43" cy="46" r="2.6" class="ink"/><circle cx="57" cy="46" r="2.6" class="ink"/><path d="M43 57q3.5-3 7 0t7 0" class="line"/><path d="M28 30c0-4 3-8 3-8s3 4 3 8a3 3 0 0 1-6 0z" fill="#8FB0E0"/></g>
  <!-- excited 0 -->
  <g transform="translate(7 130) scale(0.5)"><use href="#back"/><use href="#tail-a"/><use href="#front"/><use href="#arms-up"/><circle cx="43" cy="45" r="3.6" class="ink"/><circle cx="57" cy="45" r="3.6" class="ink"/><circle cx="44.3" cy="43.6" r="1.3" class="hi"/><circle cx="58.3" cy="43.6" r="1.3" class="hi"/><path d="M43 53q7 9 14 0z" class="ink"/><path d="M46 57q4 2 8 0z" fill="#9B1C1C"/><path d="M8 44l-6-2M9 36l-5-5M92 44l6-2M91 36l5-5" class="thin"/></g>
  <!-- excited 1 -->
  <g transform="translate(71 130) scale(0.5)"><g transform="translate(0 -5)"><use href="#back"/><use href="#tail-b"/><use href="#front"/><use href="#arms-up-high"/><circle cx="43" cy="45" r="3.6" class="ink"/><circle cx="57" cy="45" r="3.6" class="ink"/><circle cx="44.3" cy="43.6" r="1.3" class="hi"/><circle cx="58.3" cy="43.6" r="1.3" class="hi"/><path d="M43 53q7 9 14 0z" class="ink"/><path d="M46 57q4 2 8 0z" fill="#9B1C1C"/></g><path d="M12 28l-3-6M88 28l3-6M9 36l-5-5M91 36l5-5" class="thin"/></g>
  <!-- excited 2 -->
  <g transform="translate(135 130) scale(0.5)"><use href="#back"/><use href="#tail-a"/><use href="#front"/><use href="#arms-up"/><circle cx="43" cy="45" r="3.6" class="ink"/><circle cx="57" cy="45" r="3.6" class="ink"/><circle cx="44.3" cy="43.6" r="1.3" class="hi"/><circle cx="58.3" cy="43.6" r="1.3" class="hi"/><path d="M43 53q7 9 14 0z" class="ink"/><path d="M46 57q4 2 8 0z" fill="#9B1C1C"/><path d="M8 44l-6-2M12 28l-3-6M92 44l6-2M88 28l3-6" class="thin"/></g>
  <!-- asleep 0 -->
  <g transform="translate(7 194) scale(0.5)"><g transform="rotate(-14 50 60)"><use href="#back"/><use href="#tail-a"/><use href="#front"/><path d="M34 80L24 96" class="arm"/><path d="M66 80C72 90 60 96 52 92" class="arm"/><use href="#hand" x="23" y="97"/><use href="#hand" x="51" y="92"/><path d="M39 47q4 3 8 0M53 47q4 3 8 0" class="line"/><path d="M46 56h8" class="line"/></g><path d="M78 26h8l-8 8h8" class="thin"/></g>
  <!-- asleep 1 -->
  <g transform="translate(71 194) scale(0.5)"><g transform="rotate(-14 50 60) translate(0 -1.5)"><use href="#back"/><use href="#tail-a"/><use href="#front"/><path d="M34 80L24 96" class="arm"/><path d="M66 80C72 90 60 96 52 92" class="arm"/><use href="#hand" x="23" y="97"/><use href="#hand" x="51" y="92"/><path d="M39 47q4 3 8 0M53 47q4 3 8 0" class="line"/><path d="M46 56h8" class="line"/></g><path d="M78 26h8l-8 8h8M88 14h6l-6 6h6" class="thin"/></g>
  <!-- asleep 2 -->
  <g transform="translate(135 194) scale(0.5)"><g transform="rotate(-14 50 60)"><use href="#back"/><use href="#tail-a"/><use href="#front"/><path d="M34 80L24 96" class="arm"/><path d="M66 80C72 90 60 96 52 92" class="arm"/><use href="#hand" x="23" y="97"/><use href="#hand" x="51" y="92"/><path d="M39 47q4 3 8 0M53 47q4 3 8 0" class="line"/><path d="M46 56h8" class="line"/></g><path d="M78 26h8l-8 8h8M88 14h6l-6 6h6M96 4h4l-4 4h4" class="thin"/></g>
  <!-- celebrating 0 -->
  <g transform="translate(7 258) scale(0.5)"><use href="#back"/><use href="#tail-a"/><use href="#front"/><use href="#arms-up"/><path d="M83 55v-22M83 33l12 4-12 4" stroke="#16161A" stroke-width="1.5" fill="#B5470C" stroke-linejoin="round"/><path d="M39 46q4-4 8 0M53 46q4-4 8 0" class="line"/><path d="M41 53q9 9 18 0z" class="ink"/><rect x="8" y="20" width="5" height="5" fill="#E0A93A" transform="rotate(20 10 22)"/><circle cx="34" cy="14" r="2.2" fill="#22508F"/><circle cx="70" cy="10" r="2.2" fill="#7FC08A"/><rect x="4" y="60" width="4" height="4" fill="#7FC08A"/></g>
  <!-- celebrating 1 -->
  <g transform="translate(71 258) scale(0.5)"><use href="#back"/><use href="#tail-b"/><use href="#front"/><use href="#arms-up"/><path d="M83 55v-22M83 33l12-2-10 8" stroke="#16161A" stroke-width="1.5" fill="#B5470C" stroke-linejoin="round"/><path d="M39 46q4-4 8 0M53 46q4-4 8 0" class="line"/><path d="M41 53q9 9 18 0z" class="ink"/><rect x="20" y="8" width="4" height="4" fill="#B5470C" transform="rotate(-15 22 10)"/><circle cx="36" cy="22" r="2.2" fill="#22508F"/><rect x="92" y="18" width="5" height="5" fill="#22508F" transform="rotate(30 94 20)"/><circle cx="96" cy="72" r="2.2" fill="#E0A93A"/></g>
  <!-- celebrating 2 -->
  <g transform="translate(135 258) scale(0.5)"><use href="#back"/><use href="#tail-a"/><use href="#front"/><use href="#arms-up"/><path d="M83 55v-22M83 33l10 8-10 2" stroke="#16161A" stroke-width="1.5" fill="#B5470C" stroke-linejoin="round"/><path d="M39 46q4-4 8 0M53 46q4-4 8 0" class="line"/><path d="M41 53q9 9 18 0z" class="ink"/><rect x="8" y="30" width="5" height="5" fill="#E0A93A" transform="rotate(20 10 32)"/><circle cx="72" cy="20" r="2.2" fill="#7FC08A"/><rect x="6" y="70" width="4" height="4" fill="#7FC08A"/><circle cx="94" cy="60" r="2.2" fill="#22508F"/></g>
  <!-- thinking 0 -->
  <g transform="translate(7 322) scale(0.5)"><use href="#back"/><use href="#tail-a"/><use href="#front"/><path d="M34 80L20 94" class="arm"/><path d="M66 80C76 74 66 62 58 60" class="arm"/><use href="#hand" x="19" y="95"/><use href="#hand" x="56" y="59"/><path d="M37 39l10-1" class="line"/><circle cx="43" cy="45" r="2.6" class="ink"/><circle cx="57" cy="44" r="2.6" class="ink"/><path d="M44 55l8-1.5" class="line"/><circle cx="78" cy="26" r="2" fill="#B3B3B8"/><circle cx="84" cy="18" r="3" fill="#B3B3B8"/><ellipse cx="94" cy="8" rx="12" ry="7" fill="#B3B3B8"/><circle cx="89" cy="8" r="1.4" fill="#16161A"/></g>
  <!-- thinking 1 -->
  <g transform="translate(71 322) scale(0.5)"><use href="#back"/><use href="#tail-a"/><use href="#front"/><path d="M34 80L20 94" class="arm"/><path d="M66 80C76 74 66 62 58 60" class="arm"/><use href="#hand" x="19" y="95"/><use href="#hand" x="56" y="59"/><path d="M37 39l10-1" class="line"/><circle cx="43" cy="45" r="2.6" class="ink"/><circle cx="57" cy="44" r="2.6" class="ink"/><path d="M44 55l8-1.5" class="line"/><circle cx="78" cy="26" r="2" fill="#B3B3B8"/><circle cx="84" cy="18" r="3" fill="#B3B3B8"/><ellipse cx="94" cy="8" rx="12" ry="7" fill="#B3B3B8"/><circle cx="89" cy="8" r="1.4" fill="#16161A"/><circle cx="94" cy="8" r="1.4" fill="#16161A"/></g>
  <!-- thinking 2 -->
  <g transform="translate(135 322) scale(0.5)"><use href="#back"/><use href="#tail-a"/><use href="#front"/><path d="M34 80L20 94" class="arm"/><path d="M66 80C76 74 66 62 58 60" class="arm"/><use href="#hand" x="19" y="95"/><use href="#hand" x="56" y="59"/><path d="M37 39l10-1" class="line"/><circle cx="43" cy="45" r="2.6" class="ink"/><circle cx="57" cy="44" r="2.6" class="ink"/><path d="M44 55l8-1.5" class="line"/><circle cx="78" cy="26" r="2" fill="#B3B3B8"/><circle cx="84" cy="18" r="3" fill="#B3B3B8"/><ellipse cx="94" cy="8" rx="12" ry="7" fill="#B3B3B8"/><circle cx="89" cy="8" r="1.4" fill="#16161A"/><circle cx="94" cy="8" r="1.4" fill="#16161A"/><circle cx="99" cy="8" r="1.4" fill="#16161A"/></g>
</svg>
