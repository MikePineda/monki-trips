# SPDX-License-Identifier: AGPL-3.0-only
#
# Opens or updates the release PR on every push to main (manifest mode:
# release-please-config.json + .release-please-manifest.json). Merging that
# PR bumps package.json, writes CHANGELOG.md, tags vX.Y.Z and creates a
# GitHub Release. Nothing is built or published here: v1 ships no image.
#
# Token: RELEASE_PLEASE_TOKEN (fine-grained PAT, Contents + Pull requests +
# Issues: write) when the secret exists, so the release PR triggers CI and
# can satisfy the required checks; otherwise GITHUB_TOKEN, whose PRs run no
# workflows (push an empty commit to the release branch to get checks).
name: release-please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
