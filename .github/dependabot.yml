version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # TypeScript majors are gated by Angular and AdonisJS support: bump by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @types/node follows the Node major in .nvmrc, not the latest release.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build
      include: scope
    groups:
      adonisjs:
        patterns: ['@adonisjs/*', '@japa/*', '@vinejs/*', '@tuyau/*', '@poppinss/*']
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint', '@jsverse/*']
      tooling:
        patterns: ['*']
        exclude-patterns:
          [
            '@adonisjs/*',
            '@japa/*',
            '@vinejs/*',
            '@tuyau/*',
            '@poppinss/*',
            '@angular/*',
            '@angular-devkit/*',
            'angular-eslint',
            '@jsverse/*',
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The runtime image follows the Node LTS major in .nvmrc (24): bump by hand.
      - dependency-name: node
        update-types: ['version-update:semver-major']
      # Postgres majors need a dump/restore on the production host: bump by hand.
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build
    groups:
      images:
        patterns: ['*']
