<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="t d">
  <title id="t">Golo and Lina, a pair of swallows: six states</title>
  <desc id="d">Original artwork for monki-trips, AGPL-3.0-only. Happy, worried, excited, asleep, celebrating and thinking.</desc>
  <style>
    .label { font: 500 14px/1 system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #4B4B55; text-anchor: middle; }
    .name { font: 600 22px/1 system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #16161A; }
    .sub { font: 400 14px/1 system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #62626D; }
    .navy { fill: #1F2A44; } .wing { fill: #2E3D63; } .belly { fill: #FAFAF7; } .rust { fill: #B5470C; } .ink { fill: #16161A; }
    .line { stroke: #16161A; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .wire { stroke: #6A6A75; stroke-width: 2; stroke-linecap: round; fill: none; }
    .thin { stroke: #62626D; stroke-width: 1.5; stroke-linecap: round; fill: none; }
  </style>
  <defs>
    <!-- Perched swallow, facing right, without eyes. Local box 100x60, feet at y=56. -->
    <g id="perched">
      <path d="M22 40L0 58l22-12L2 50z" class="navy"/>
      <path d="M20 40c0-12 14-22 30-22 10 0 18 4 22 10-4 8-10 18-26 22-14 3-24-2-26-10z" class="navy"/>
      <path d="M26 46c12 6 26 2 36-10-6 12-22 18-36 10z" class="belly"/>
      <path d="M30 32c10-10 28-8 24 4-4 6-16 6-24-4z" class="wing"/>
      <circle cx="74" cy="22" r="10" class="navy"/>
      <path d="M72 29a7 7 0 0 0 10-2c-3-3-7-3-10 2z" class="rust"/>
      <path d="M68 14c3-2 7-2 10 0-2 2-7 2-10 0z" class="rust"/>
      <path d="M83 22l9 2-9 2z" class="ink"/>
      <path d="M44 50l-2 7M54 49l-2 8" stroke="#16161A" stroke-width="1.5" fill="none"/>
    </g>
    <!-- Flying swallow, facing right. Local box 100x60. -->
    <g id="flying">
      <path d="M30 34L6 50l22-12L4 40z" class="navy"/>
      <path d="M30 28C34 14 60 10 72 20c6 6 2 18-14 20-12 2-24 0-28-12z" class="navy"/>
      <path d="M38 38c10 6 24 6 32-6-8 6-22 10-32 6z" class="belly"/>
      <path d="M44 22C36 6 20 0 8 4c10 2 22 10 30 22z" class="wing"/>
      <path d="M56 22c8-16 26-20 38-14-12 0-26 6-32 18z" class="wing"/>
      <circle cx="76" cy="20" r="9" class="navy"/>
      <path d="M78 24a6 6 0 0 0 8-2c-3-2-6-3-8 2z" class="rust"/>
      <path d="M85 20l8 2-8 2z" class="ink"/>
    </g>
    <g id="eye"><circle r="2.6" fill="#FAFAF7"/><circle cx="0.6" r="1.6" fill="#16161A"/></g>
    <g id="nest">
      <path d="M0 0c6 14 44 14 50 0" fill="#C99A72"/>
      <path d="M2 2c8 10 38 10 46 0M6 6c8 6 30 6 38 0M12 9c6 3 20 3 26 0" stroke="#8B5A2B" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="390" height="844" fill="#FAFAF7"/>
  <text x="16" y="44" class="name">Golo and Lina</text>
  <text x="16" y="66" class="sub">Two swallows that always return to the same nest</text>
  <line x1="16" y1="82" x2="374" y2="82" stroke="#DCDCD6"/>

  <!-- happy: perched together on a wire, leaning in -->
  <g transform="translate(16 96)">
    <path d="M0 150h175" class="wire"/>
    <g transform="translate(0 88) scale(1.1)"><use href="#perched"/><use href="#eye" x="76" y="20"/></g>
    <g transform="translate(175 92) scale(-1 1)"><use href="#perched"/><use href="#eye" x="76" y="20"/></g>
    <text x="87" y="225" class="label">happy</text>
  </g>

  <!-- worried: apart on the wire, ruffled, a sweat drop; a dashed empty space where the document should be -->
  <g transform="translate(199 96)">
    <path d="M0 150h175" class="wire"/>
    <g transform="translate(-6 92) scale(1)"><use href="#perched"/><use href="#eye" x="76" y="20"/><path d="M66 10l-3-5M70 8l0-6M74 9l3-5" class="line"/><path d="M68 16l8 2" class="line"/></g>
    <g transform="translate(181 92) scale(-1 1)"><use href="#perched"/><use href="#eye" x="76" y="20"/><path d="M68 16l8 2" class="line"/></g>
    <path d="M160 86c0-4 3-8 3-8s3 4 3 8a3 3 0 0 1-6 0z" fill="#8FB0E0"/>
    <rect x="68" y="30" width="40" height="52" rx="4" fill="none" stroke="#85858F" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M80 46h16M80 56h16M80 66h10" class="thin" stroke-dasharray="2 3"/>
    <text x="87" y="225" class="label">worried</text>
  </g>

  <!-- excited: both in the air, wings wide, motion lines -->
  <g transform="translate(16 346)">
    <g transform="translate(0 30) scale(1.3)"><use href="#flying"/><use href="#eye" x="78" y="18"/><path d="M85 23l6 1-6 2" fill="#9B1C1C" stroke="none"/></g>
    <g transform="translate(60 100) scale(1.15)"><use href="#flying"/><use href="#eye" x="78" y="18"/></g>
    <path d="M6 20l-6-4M8 10l-4-6M4 32l-6 0M70 100l-8-2M68 112l-8 2M80 92l-6-6" class="thin"/>
    <text x="87" y="225" class="label">excited</text>
  </g>

  <!-- asleep: tucked together in the nest, eyes closed -->
  <g transform="translate(199 346)">
    <g transform="translate(62 150) scale(1.2)"><use href="#nest"/></g>
    <g transform="translate(14 98) scale(1)"><use href="#perched"/><path d="M71 20q4 3 8 0" class="line"/></g>
    <g transform="translate(162 98) scale(-1 1)"><use href="#perched"/><path d="M71 20q4 3 8 0" class="line"/></g>
    <path d="M118 52h10l-10 10h10" class="thin" stroke="#4B4B55"/>
    <path d="M134 34h8l-8 8h8" class="thin" stroke="#4B4B55"/>
    <path d="M146 20h6l-6 6h6" class="thin" stroke="#4B4B55"/>
    <text x="87" y="225" class="label">asleep</text>
  </g>

  <!-- celebrating: a loop around the nest, confetti -->
  <g transform="translate(16 596)">
    <g transform="translate(62 150) scale(1.2)"><use href="#nest"/></g>
    <path d="M30 130C10 90 40 40 88 48s70 60 40 90" class="thin" stroke-dasharray="3 5"/>
    <g transform="translate(8 60) scale(1.1)"><use href="#flying"/><use href="#eye" x="78" y="18"/></g>
    <g transform="translate(170 110) scale(-1.1 1.1)"><use href="#flying"/><use href="#eye" x="78" y="18"/></g>
    <rect x="30" y="20" width="5" height="5" fill="#E0A93A" transform="rotate(20 32 22)"/>
    <rect x="120" y="14" width="4" height="4" fill="#B5470C" transform="rotate(-15 122 16)"/>
    <circle cx="90" cy="20" r="2.2" fill="#22508F"/>
    <circle cx="150" cy="40" r="2.2" fill="#7FC08A"/>
    <rect x="12" y="100" width="4" height="4" fill="#7FC08A" transform="rotate(10 14 102)"/>
    <circle cx="160" cy="80" r="2.2" fill="#E0A93A"/>
    <text x="87" y="225" class="label">celebrating</text>
  </g>

  <!-- thinking: one head tilted, thought bubble -->
  <g transform="translate(199 596)">
    <path d="M0 150h175" class="wire"/>
    <g transform="translate(0 88) scale(1.1)"><g transform="rotate(-14 74 22)"><use href="#perched"/><use href="#eye" x="76" y="20"/></g></g>
    <g transform="translate(175 92) scale(-1 1)"><use href="#perched"/><use href="#eye" x="76" y="20"/><path d="M68 16l8 2" class="line"/></g>
    <circle cx="112" cy="66" r="2" fill="#B3B3B8"/><circle cx="120" cy="54" r="3" fill="#B3B3B8"/>
    <ellipse cx="134" cy="38" rx="14" ry="9" fill="#B3B3B8"/>
    <circle cx="128" cy="38" r="1.5" fill="#16161A"/><circle cx="134" cy="38" r="1.5" fill="#16161A"/><circle cx="140" cy="38" r="1.5" fill="#16161A"/>
    <text x="87" y="225" class="label">thinking</text>
  </g>
</svg>
