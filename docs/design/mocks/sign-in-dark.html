      body {

  <body
    class="bg-surface-0 text-ink-1 min-h-screen flex flex-col justify-between selection:bg-accent-soft selection:text-accent"
    style="
      min-height: max(884px, 100dvh);
      background-color: #0f1113;
      color: #ecedee;
      --tw-bg-opacity: 1;
    "
  >
    <!-- Main Viewport Container (Constrained 390-480px, iOS Safe Margins) -->
    <main
      class="w-full max-w-[480px] mx-auto min-h-screen flex flex-col justify-between px-space-lg pt-[47px] pb-[34px]"
    >
      <!-- Content Segment -->
      <div class="w-full pt-12">
        <!-- 1. Mascot Placeholder Slot (96x96 px plain outlined square slot) -->
        <div
          aria-hidden="true"
          class="w-[96px] h-[96px] bg-surface-2 border border-dashed border-line-strong rounded-xl flex items-center justify-center select-none"
          style="background-color: #202326; border-color: #6a7079"
        >
          <span class="font-code-label text-code-label text-ink-3" style="color: #8a9097"
            >Kiko</span
          >
        </div>
        <!-- 2. Title & Subtitle -->
        <header class="mt-6">
          <h1
            class="font-title text-title text-ink-1 tracking-tight"
            style="
              color: #ecedee;
              font-size: 24px;
              font-weight: 600;
              line-height: 32px;
              font-family: 'IBM Plex Sans', sans-serif;
            "
          >
            Sign in
          </h1>
          <p class="font-body text-body text-ink-2 mt-2" style="color: #b4b9bf">
            Your trips, documents and budget, even without a connection.
          </p>
        </header>
        <!-- 3. Form Fields -->
        <form class="mt-8 space-y-4" onsubmit="event.preventDefault()">
          <!-- Email field -->
          <div>
            <label
              class="block font-label text-label text-ink-2 mb-1.5"
              for="email"
              style="color: #b4b9bf"
            >
              Email
            </label>
            <input
              autocomplete="email"
              class="w-full h-12 bg-surface-1 border border-line-strong rounded-xl px-3.5 font-body text-body text-ink-1 focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent focus:ring-offset-2 transition-all placeholder:text-ink-3"
              id="email"
              name="email"
              required=""
              style="background-color: #17191c; border-color: #6a7079; color: #ecedee"
              type="email"
              value="traveller@example.com"
            />
          </div>
          <!-- Password field -->
          <div>
            <label
              class="block font-label text-label text-ink-2 mb-1.5"
              for="password"
              style="color: #b4b9bf"
            >
              Password
            </label>
            <div
              class="relative flex items-center h-12 bg-surface-1 border border-line-strong rounded-xl px-3.5 focus-within:border-accent focus-within:ring-2 focus-within:ring-accent focus-within:ring-offset-2 transition-all"
              style="background-color: #17191c; border-color: #6a7079"
            >
              <input
                autocomplete="current-password"
                class="w-full bg-transparent border-0 p-0 font-body text-body text-ink-1 focus:outline-none focus:ring-0"
                id="password"
                name="password"
                required=""
                style="color: #ecedee"
                type="password"
                value="••••••••••••"
              />
              <button
                aria-label="Show password"
                class="flex items-center justify-center text-ink-2 hover:text-ink-1 transition-colors p-1 ml-2 focus:outline-none"
                id="toggle-password"
                style="color: #b4b9bf"
                type="button"
              >
                <svg
                  class="shrink-0 pointer-events-none"
                  fill="none"
                  height="20"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.75"
                  viewbox="0 0 24 24"
                  width="20"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
          <!-- Quiet Link -->
          <div class="flex justify-end pt-1">
            <a
              class="font-label text-label text-accent hover:underline focus:outline-none focus:ring-1 focus:ring-accent rounded-DEFAULT"
              href="#"
              style="color: #f08a4b"
            >
              Forgot your password?
            </a>
          </div>
          <!-- 4. Primary Action Button -->
          <div class="pt-2">
            <button
              class="w-full h-12 bg-accent hover:bg-[#e07a3b] text-surface-0 font-heading text-heading flex items-center justify-center rounded-xl transition-colors duration-150 active:scale-[0.99] focus:outline-none focus:ring-2 focus:ring-accent focus:ring-offset-2 cursor-pointer"
              style="background-color: #f08a4b; color: #0f1113"
              type="submit"
            >
              Sign in
            </button>
          </div>
        </form>
        <!-- 5. Divider & Invitation Note -->
        <div class="mt-8">
          <hr class="border-t border-line border-0" style="border-color: #2c3035" />
          <p class="font-body text-body text-ink-2 mt-6" style="color: #b4b9bf">
            Have an invitation?
            <a
              class="text-ink-1 underline hover:text-accent transition-colors"
              href="#"
              style="color: #ecedee"
              >Open the link you received.</a
            >
          </p>
        </div>
      </div>
      <!-- 6. Footer Area -->
      <footer class="pt-12 pb-2 text-center space-y-3">
        <!-- Language Switch -->
        <div class="flex items-center justify-center space-x-2 font-label text-label">
          <button
            class="text-ink-1 font-body-strong hover:opacity-80 transition-opacity"
            style="color: #ecedee"
            type="button"
          >
            English
          </button>
          <span class="text-line select-none" style="color: #2c3035">·</span>
          <button
            class="text-ink-3 font-normal hover:text-ink-2 transition-colors"
            style="color: #8a9097"
            type="button"
          >
            Español
          </button>
        </div>
        <!-- Legal Links -->
        <nav aria-label="Legal navigation">
          <div
            class="flex items-center justify-center space-x-2 font-caption text-caption text-ink-3"
            style="color: #8a9097"
          >
            <a class="hover:text-ink-2 transition-colors" href="#">Privacy</a>
            <span class="text-line select-none" style="color: #2c3035">·</span>
            <a class="hover:text-ink-2 transition-colors" href="#">Terms</a>
          </div>
        </nav>
      </footer>
    </main>
    <!-- Interactive script for password visibility toggle -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const toggleBtn = document.getElementById('toggle-password')
        const passwordInput = document.getElementById('password')

        if (toggleBtn && passwordInput) {
          toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password'
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password')
            toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password')

            toggleBtn.innerHTML = isPassword
              ? `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 pointer-events-none"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>`
              : `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 pointer-events-none"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`
          })
        }
      })
    </script>
  </body>
</html>
